# ─────────────────────────────────────────────────────────────
# nginx.conf — HutepVPN Bot
# Reverse proxy: терминирует SSL и проксирует на бот-контейнер
# ─────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Логи ────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time utl=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Оптимизация ─────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml application/xml+rss;

    # ── upstream: бот ────────────────────────────────────────────
    upstream hutepvpn_bot {
        server bot:8080;
        keepalive 32;
    }

    # ── HTTP → HTTPS редирект ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge для Let's Encrypt (Certbot)
        location /.well-known/acme-challenge/ {
            root /etc/nginx/ssl;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS сервер ─────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL-сертификат (см. README.md → положите сюда cert.pem и key.pem)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header Strict-Transport-Security "max-age=63072000" always;

        # ── Telegram webhook ──────────────────────────────────────
        location /webhook {
            proxy_pass http://hutepvpn_bot/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Telegram ждёт ответ ≤ 60 сек — ставим таймаут
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # ── NOWPayments webhook ───────────────────────────────────
        location /webhook/nowpayments {
            proxy_pass http://hutepvpn_bot/webhook/nowpayments;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # ── healthcheck ───────────────────────────────────────────
        location /health {
            proxy_pass http://hutepvpn_bot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
