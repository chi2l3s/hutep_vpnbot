# ─────────────────────────────────────────────────────────────
# HutepVPN Bot — Docker Compose
# Production-ready stack:
#   bot      — Python-приложение (Aiogram + FastAPI webhook)
#   nginx    — Reverse proxy (SSL termination, serves Telegram webhooks)
#   watchtower — Автообновление контейнеров (опционально)
# ─────────────────────────────────────────────────────────────

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hutepvpn_bot
    restart: unless-stopped
    volumes:
      # База данных и данные — в именованный том
      - hutepvpn_data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; asyncio.run(asyncio.sleep(0))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hutepvpn_net
    depends_on:
      nginx:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: hutepvpn_nginx
    restart: unless-stopped
    ports:
      # Внешние порты: HTTP и HTTPS
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL-сертификаты (см. README.md)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # access logs
      - hutepvpn_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hutepvpn_net

  # ── Опционально: автообновление через Watchtower ──────────────
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: hutepvpn_watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - WATCHTOWER_CLEANUP=true
  #     - WATCHTOWER_POLL_INTERVAL=3600
  #   networks:
  #     - hutepvpn_net

networks:
  hutepvpn_net:
    driver: bridge

volumes:
  hutepvpn_data:
  hutepvpn_logs:
